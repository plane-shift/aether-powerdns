---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zones.dns.aetherplatform.cloud
spec:
  group: dns.aetherplatform.cloud
  names:
    kind: Zone
    listKind: ZoneList
    plural: zones
    singular: zone
    shortNames: [pdnszone]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - jsonPath: .spec.zoneName
          name: Zone
          type: string
        - jsonPath: .spec.kind
          name: Kind
          type: string
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.serial
          name: Serial
          type: integer
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [serverRef, zoneName]
              # Cross-field rules only — immutability rules live on the
              # narrowest field/object schema below, which keeps the CEL
              # cost estimate within the apiserver's per-schema budget.
              x-kubernetes-validations:
                - rule: "self.kind != 'Secondary' || (has(self.masters) && self.masters.size() > 0)"
                  message: "masters is required for Secondary zones"
                - rule: "self.kind == 'Secondary' || !has(self.masters) || self.masters.size() == 0"
                  message: "masters is only allowed on Secondary zones"
              properties:
                serverRef:
                  type: object
                  required: [name]
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "serverRef is immutable after creation"
                  properties:
                    # maxLength bounds keep the CEL rules within the
                    # apiserver's cost budget (unbounded strings are
                    # costed at worst case and get rejected).
                    name: { type: string, minLength: 1, maxLength: 253 }
                    namespace: { type: string, maxLength: 63 }
                zoneName:
                  type: string
                  maxLength: 253
                  pattern: '^([a-z0-9_][a-z0-9_\-]*\.)+$'
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "zoneName is immutable after creation"
                kind:
                  type: string
                  enum: [Native, Primary, Secondary]
                  default: Native
                masters:
                  type: array
                  maxItems: 16
                  items:
                    type: string
                    minLength: 1
                    maxLength: 253
                nameservers:
                  type: array
                  maxItems: 16
                  items:
                    type: string
                    maxLength: 253
                    pattern: '\.$'
                soa:
                  type: object
                  required: [hostmaster]
                  properties:
                    hostmaster:
                      type: string
                      maxLength: 253
                      pattern: '\.$'
                    ttl:
                      type: integer
                      format: int32
                      minimum: 1
                      default: 3600
                dnssec:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                deletionPolicy:
                  type: string
                  enum: [Delete, Orphan]
                  default: Delete
            status:
              type: object
              properties:
                phase: { type: string }
                serial: { type: integer, format: int64 }
                dsRecords:
                  type: array
                  items: { type: string }
                observedGeneration: { type: integer, format: int64 }
                failureMessage: { type: string }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: { type: string }
                      status: { type: string, enum: ["True", "False", "Unknown"] }
                      reason: { type: string }
                      message: { type: string }
                      observedGeneration: { type: integer, format: int64 }
                      lastTransitionTime: { type: string, format: date-time }
