---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rrsets.dns.aetherplatform.cloud
spec:
  group: dns.aetherplatform.cloud
  names:
    kind: RRSet
    listKind: RRSetList
    plural: rrsets
    singular: rrset
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - jsonPath: .spec.name
          name: Record
          type: string
        - jsonPath: .spec.type
          name: Type
          type: string
        - jsonPath: .spec.zoneRef.name
          name: Zone
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [zoneRef, name, type, records]
              # Immutability rules live on the narrowest field/object schema
              # below, which keeps the CEL cost estimate within the
              # apiserver's per-schema budget.
              properties:
                zoneRef:
                  type: object
                  required: [name]
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "zoneRef is immutable after creation — delete and recreate to move a record"
                  properties:
                    # maxLength bounds keep the CEL rules within the
                    # apiserver's cost budget (unbounded strings are
                    # costed at worst case and get rejected).
                    name: { type: string, minLength: 1, maxLength: 253 }
                    namespace: { type: string, maxLength: 63 }
                name:
                  type: string
                  maxLength: 253
                  pattern: '^(\*\.)?([a-z0-9_][a-z0-9_\-]*\.)+$'
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "name is immutable after creation — delete and recreate to rename"
                type:
                  type: string
                  maxLength: 16
                  pattern: '^[A-Z0-9]+$'
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "type is immutable after creation — delete and recreate to retype"
                ttl:
                  type: integer
                  format: int32
                  minimum: 1
                  default: 3600
                records:
                  type: array
                  minItems: 1
                  maxItems: 64
                  items:
                    type: string
                    minLength: 1
                    maxLength: 4096
                deletionPolicy:
                  type: string
                  enum: [Delete, Orphan]
                  default: Delete
            status:
              type: object
              properties:
                observedGeneration: { type: integer, format: int64 }
                failureMessage: { type: string }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: { type: string }
                      status: { type: string, enum: ["True", "False", "Unknown"] }
                      reason: { type: string }
                      message: { type: string }
                      observedGeneration: { type: integer, format: int64 }
                      lastTransitionTime: { type: string, format: date-time }
