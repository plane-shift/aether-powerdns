---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rrsets.dns.aetherplatform.cloud
spec:
  group: dns.aetherplatform.cloud
  names:
    kind: RRSet
    listKind: RRSetList
    plural: rrsets
    singular: rrset
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - jsonPath: .spec.name
          name: Record
          type: string
        - jsonPath: .spec.type
          name: Type
          type: string
        - jsonPath: .spec.zoneRef.name
          name: Zone
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [zoneRef, name, type, records]
              x-kubernetes-validations:
                - rule: "self.zoneRef.name == oldSelf.zoneRef.name && (has(self.zoneRef.namespace) ? self.zoneRef.namespace : '') == (has(oldSelf.zoneRef.namespace) ? oldSelf.zoneRef.namespace : '')"
                  message: "zoneRef is immutable after creation — delete and recreate to move a record"
                - rule: "self.name == oldSelf.name"
                  message: "name is immutable after creation — delete and recreate to rename"
                - rule: "self.type == oldSelf.type"
                  message: "type is immutable after creation — delete and recreate to retype"
              properties:
                zoneRef:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string, minLength: 1 }
                    namespace: { type: string }
                name:
                  type: string
                  pattern: '^(\*\.)?([a-z0-9_][a-z0-9_\-]*\.)+$'
                type:
                  type: string
                  pattern: '^[A-Z0-9]+$'
                ttl:
                  type: integer
                  format: int32
                  minimum: 1
                  default: 3600
                records:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
                deletionPolicy:
                  type: string
                  enum: [Delete, Orphan]
                  default: Delete
            status:
              type: object
              properties:
                observedGeneration: { type: integer, format: int64 }
                failureMessage: { type: string }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: { type: string }
                      status: { type: string, enum: ["True", "False", "Unknown"] }
                      reason: { type: string }
                      message: { type: string }
                      observedGeneration: { type: integer, format: int64 }
                      lastTransitionTime: { type: string, format: date-time }
