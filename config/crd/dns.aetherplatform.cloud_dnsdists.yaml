---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dnsdists.dns.aetherplatform.cloud
spec:
  group: dns.aetherplatform.cloud
  names:
    kind: DNSDist
    listKind: DNSDistList
    plural: dnsdists
    singular: dnsdist
    shortNames: [ddist]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.readyReplicas
          name: Ready
          type: integer
        - jsonPath: .status.desiredReplicas
          name: Desired
          type: integer
        - jsonPath: .status.dnsEndpoint
          name: DNS
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [backendRefs]
              properties:
                replicas:
                  type: integer
                  format: int32
                  minimum: 1
                  default: 1
                image:
                  type: string
                  maxLength: 512
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                scheduling:
                  type: object
                  properties:
                    nodeSelector:
                      type: object
                      additionalProperties: { type: string }
                    tolerations:
                      type: array
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    priorityClassName: { type: string }
                    spreadAcrossZones: { type: boolean, default: false }
                backendRefs:
                  type: array
                  minItems: 1
                  maxItems: 16
                  x-kubernetes-validations:
                    - rule: "self.all(ref, !has(ref.namespace) || ref.namespace == '')"
                      message: "backendRefs must be same-namespace; backendRefs[].namespace must be empty"
                    - rule: "self.all(ref, self.exists_one(other, other.name == ref.name))"
                      message: "backendRefs must not contain duplicate names"
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 253
                        pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                      namespace: { type: string, maxLength: 63 }
                dns:
                  type: object
                  properties:
                    exposure:
                      type: string
                      enum: [none, loadBalancer, gateway]
                      default: none
                    loadBalancer:
                      type: object
                      properties:
                        ip: { type: string }
                        annotations:
                          type: object
                          additionalProperties: { type: string }
                        externalTrafficPolicy:
                          type: string
                          enum: [Cluster, Local]
                          default: Local
                        additionalServices:
                          type: array
                          items:
                            type: object
                            required: [nameSuffix]
                            properties:
                              nameSuffix:
                                type: string
                                pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                              ip: { type: string }
                              annotations:
                                type: object
                                additionalProperties: { type: string }
                              externalTrafficPolicy:
                                type: string
                                enum: [Cluster, Local]
                                default: Local
                    gateway:
                      type: object
                      required: [parentRefs]
                      properties:
                        parentRefs:
                          type: array
                          minItems: 1
                          maxItems: 8
                          items:
                            type: object
                            required: [name]
                            properties:
                              group: { type: string, maxLength: 253 }
                              kind: { type: string, maxLength: 63 }
                              name: { type: string, minLength: 1, maxLength: 253 }
                              namespace: { type: string, maxLength: 63 }
                              tcpSectionName: { type: string, maxLength: 253 }
                              udpSectionName: { type: string, maxLength: 253 }
                cache:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    maxEntries:
                      type: integer
                      format: int32
                      minimum: 1024
                      default: 100000
                rateLimit:
                  type: object
                  properties:
                    qpsPerClient:
                      type: integer
                      format: int32
                      minimum: 0
                      default: 0
                tls:
                  type: object
                  properties:
                    dot:
                      type: object
                      properties:
                        enabled: { type: boolean, default: false }
                        certificateSecretRef:
                          type: object
                          required: [name]
                          properties:
                            name: { type: string, minLength: 1, maxLength: 253 }
                    doh:
                      type: object
                      properties:
                        enabled: { type: boolean, default: false }
                        certificateSecretRef:
                          type: object
                          required: [name]
                          properties:
                            name: { type: string, minLength: 1, maxLength: 253 }
                podDisruptionBudget:
                  type: object
                  properties:
                    minAvailable:
                      type: integer
                      format: int32
                      minimum: 1
            status:
              type: object
              properties:
                phase: { type: string }
                dnsEndpoint: { type: string }
                desiredReplicas: { type: integer, format: int32 }
                readyReplicas: { type: integer, format: int32 }
                observedGeneration: { type: integer, format: int64 }
                failureMessage: { type: string }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: { type: string }
                      status: { type: string, enum: ["True", "False", "Unknown"] }
                      reason: { type: string }
                      message: { type: string }
                      observedGeneration: { type: integer, format: int64 }
                      lastTransitionTime: { type: string, format: date-time }
