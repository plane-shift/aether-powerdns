name: build

# This workflow does NOT publish. Image publishing moved to Tekton (zolab),
# which is the sole authority for what lands in GHCR and under which tag — the
# `image` job that built and pushed ghcr.io/plane-shift/aether-powerdns
# (linux/amd64,linux/arm64) on main and v* tags is gone. Two CIs pushing the
# same mutable tags raced and the last writer won. Nothing is lost at PR time:
# that job was gated on `github.event_name == 'push'`, so it never ran for a
# pull request. The Tekton trigger (aether-infra
# ci/tekton/triggers/triggers.yaml, `aether-powerdns`) reproduces the same tag
# scheme: sha-<7>, the branch/tag name, and :latest on main.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# No packages: write — this workflow no longer writes to GHCR.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26"
      - run: go mod download
      - run: go vet ./...
      - run: go test ./... -race
