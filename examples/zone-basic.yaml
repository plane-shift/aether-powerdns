# A Native zone plus records on the `demo` server from
# examples/managed-postgres.yaml. The operator seeds the apex NS (and SOA)
# once at creation; afterwards the apex NS is an ordinary record.
# ns2 glue record omitted for brevity — add one like ns1 for a servable zone.
apiVersion: dns.aetherplatform.cloud/v1alpha1
kind: Zone
metadata:
  name: example-com
  namespace: aether-system
spec:
  serverRef:
    name: demo
  zoneName: example.com.
  kind: Native
  nameservers:
    - ns1.example.com.
    - ns2.example.com.
---
apiVersion: dns.aetherplatform.cloud/v1alpha1
kind: RRSet
metadata:
  name: example-com-ns1
  namespace: aether-system
spec:
  zoneRef:
    name: example-com
  name: ns1.example.com.
  type: A
  records: ["203.0.113.53"]
---
apiVersion: dns.aetherplatform.cloud/v1alpha1
kind: RRSet
metadata:
  name: example-com-www
  namespace: aether-system
spec:
  zoneRef:
    name: example-com
  name: www.example.com.
  type: A
  ttl: 300
  records: ["203.0.113.10", "203.0.113.11"]
---
apiVersion: dns.aetherplatform.cloud/v1alpha1
kind: RRSet
metadata:
  name: example-com-mx
  namespace: aether-system
spec:
  zoneRef:
    name: example-com
  name: example.com.
  type: MX
  records: ["10 mail.example.com."]
